steps:
  # 1. Build Docker image for the Flask backend using Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/news-brief-desk/news-brief-desk:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/news-brief-desk/news-brief-desk:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/news-brief-desk/news-brief-desk:$COMMIT_SHA'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'news-brief-desk'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/news-brief-desk/news-brief-desk:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--timeout'
      - '300'
      - '--memory'
      - '2Gi'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/news-brief-desk/news-brief-desk:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/news-brief-desk/news-brief-desk:latest'

options:
  logging: CLOUD_LOGGING_ONLY
