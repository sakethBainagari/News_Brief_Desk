steps:
  # 1. Build Docker image for Flask backend (from backend directory context)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/news-brief-desk:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/news-brief-desk:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 2. Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/news-brief-desk:$COMMIT_SHA'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'news-brief-desk'
      - '--image'
      - 'gcr.io/$PROJECT_ID/news-brief-desk:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/news-brief-desk:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/news-brief-desk:latest'

options:
  logging: CLOUD_LOGGING_ONLY
